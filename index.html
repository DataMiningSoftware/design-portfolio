<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nawfal Nadzrim — Projects</title>
    <meta
      name="description"
      content="Portfolio of Nawfal Nadzrim — AI/LLM, machine learning, backend, mobile, and design projects."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <h1>Nawfal Nadzrim</h1>
        <p class="tagline">
          Software &amp; AI engineer building across LLM apps, machine learning,
          backend systems, mobile, and design.
        </p>
        <div class="hero-links">
          <a class="btn btn-primary" href="https://github.com/DataMiningSoftware" target="_blank" rel="noopener">
            GitHub
          </a>
          <!-- Add your LinkedIn / email when ready:
          <a class="btn" href="https://www.linkedin.com/in/YOUR_HANDLE" target="_blank" rel="noopener">LinkedIn</a>
          <a class="btn" href="mailto:you@example.com">Email</a>
          -->
        </div>
        <p class="hero-note">
          {{projects.length}} projects · some live, some with test suites · all on GitHub
        </p>
      </div>
    </header>

    <nav class="filters" aria-label="Filter projects">
      <button class="filter is-active" data-filter="all">All</button>
      <button class="filter" data-filter="ai">AI / LLM</button>
      <button class="filter" data-filter="ml">Machine Learning</button>
      <button class="filter" data-filter="backend">Backend</button>
      <button class="filter" data-filter="mobile">Mobile</button>
      <button class="filter" data-filter="design">Design</button>
      <button class="filter" data-filter="team">Team</button>
      <button class="filter" data-filter="private">Private</button>
    </nav>

    <main>
      <section id="grid" class="grid" aria-label="Projects"></section>
    </main>

    <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Project details">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel">
        <button class="modal-close" data-close aria-label="Close">&times;</button>
        <div id="modal-content"></div>
      </div>
    </div>

    <footer class="footer">
      <p>Built as a single static site &middot; deployable anywhere.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
